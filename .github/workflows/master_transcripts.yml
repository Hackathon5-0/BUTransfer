# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Generated by Azure Deployment Center, adapted for this repo: the app lives in 2_Code/transfer-app,
# and the React frontend is built and bundled into the Express backend (served from backend/public).

name: Build and deploy Node.js app to Azure Web App - TranScripts

on:
  push:
    branches:
      - 'master'
    paths:
      - '2_Code/transfer-app/**'
      - '.github/workflows/master_transcripts.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: |
            2_Code/transfer-app/frontend/package-lock.json
            2_Code/transfer-app/backend/package-lock.json

      - name: Build frontend (API on the same origin)
        working-directory: 2_Code/transfer-app/frontend
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Install backend and bundle the frontend build
        working-directory: 2_Code/transfer-app/backend
        run: |
          npm ci --omit=dev
          rm -rf public
          cp -r ../frontend/dist public

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: 2_Code/transfer-app/backend

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TranScripts'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B86FCA508DB040619C1624DCA3E49790 }}
